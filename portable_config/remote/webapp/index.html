<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<title>Stremio Kai Remote</title>
<style>
  :root {
    --bg: #0b0d12; --surface: #161a23; --surface-2: #1f2531;
    --text: #e8ebf2; --muted: #8b93a7; --accent: #7b5cff; --accent-2: #4ad6b4;
    --danger: #ff5c7a; --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--surface-2);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; flex: 1; }
  .pill { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.on { background: rgba(74,214,180,.15); color: var(--accent-2); }
  .pill.off { background: rgba(255,92,122,.15); color: var(--danger); }

  main { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .panel { display: none; }
  .panel.active { display: block; }

  nav.tabs {
    display: flex; border-top: 1px solid var(--surface-2); background: var(--surface);
  }
  nav.tabs button {
    flex: 1; background: none; border: 0; color: var(--muted);
    padding: 12px 4px 16px; font-size: 12px; font-weight: 600;
  }
  nav.tabs button.active { color: var(--accent); }

  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .title-big { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }

  .scrub { width: 100%; margin: 14px 0 6px; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row.wrap { flex-wrap: wrap; }
  button.btn {
    flex: 1; min-width: 64px; background: var(--surface-2); border: 0; color: var(--text);
    padding: 14px 10px; border-radius: 12px; font-size: 14px; font-weight: 600;
  }
  button.btn:active { background: #2b3446; }
  button.btn.primary { background: var(--accent); }
  button.btn.wide { flex: 100%; }
  button.btn.sm { padding: 10px 8px; font-size: 13px; }

  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 8px auto; }
  .dpad button { aspect-ratio: 1; font-size: 20px; }
  .dpad .mid { background: var(--accent); }
  .dpad .blank { visibility: hidden; }

  select, input[type=text] {
    width: 100%; background: var(--surface-2); border: 1px solid #2b3140; color: var(--text);
    padding: 12px; border-radius: 10px; font-size: 15px; margin-top: 8px;
  }
  label.lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--surface); border-radius: 12px; margin-bottom: 8px;
  }
  .list-item:active { background: var(--surface-2); }
  .list-item img { width: 44px; height: 62px; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
  .list-item .meta { flex: 1; min-width: 0; }
  .list-item .meta .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .meta .d { font-size: 12px; color: var(--muted); }
  .rowlabel { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }
  .hscroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .hscroll .poster { flex: 0 0 96px; }
  .hscroll .poster img { width: 96px; height: 140px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
  .hscroll .poster .n { font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .crumb button { background: var(--surface-2); border: 0; color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Stremio&nbsp;Kai Remote</h1>
  <span class="pill" id="pill-mpv">player</span>
  <span class="pill" id="pill-ui">ui</span>
</header>

<main>
  <!-- NOW PLAYING ------------------------------------------------------->
  <section class="panel active" id="panel-play">
    <div class="card">
      <p class="title-big" id="np-title">Nothing playing</p>
      <p class="sub" id="np-sub">Open the Browse tab to start something.</p>
      <input class="scrub" type="range" id="scrub" min="0" max="1000" value="0" />
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>

      <div class="row">
        <button class="btn sm" data-cmd="seek_relative" data-args='{"secs":-85}'>⏮ 85s</button>
        <button class="btn sm" data-cmd="seek_relative" data-args='{"secs":-10}'>-10s</button>
        <button class="btn primary" id="btn-pause" data-cmd="toggle_pause">Pause</button>
        <button class="btn sm" data-cmd="seek_relative" data-args='{"secs":10}'>+10s</button>
        <button class="btn sm" data-cmd="seek_relative" data-args='{"secs":85}'>85s ⏭</button>
      </div>

      <div class="row">
        <button class="btn" data-cmd="perform_skip">Skip Intro/Outro</button>
        <button class="btn" id="btn-next" data-cmd="player_next_video">Next Episode ▶</button>
      </div>
    </div>

    <div class="card">
      <label class="lbl">Volume <span id="vol-val"></span></label>
      <input class="scrub" type="range" id="vol" min="0" max="130" value="100" />
      <div class="row">
        <button class="btn sm" data-cmd="mute">Mute</button>
        <button class="btn sm" data-cmd="set_speed" data-args='{"value":1}'>1x</button>
        <button class="btn sm" data-cmd="set_speed" data-args='{"value":1.5}'>1.5x</button>
        <button class="btn sm" data-cmd="set_speed" data-args='{"value":2}'>2x</button>
      </div>
    </div>

    <div class="card">
      <label class="lbl">Audio</label>
      <select id="sel-audio"></select>
      <label class="lbl">Subtitles</label>
      <select id="sel-sub"></select>
    </div>
  </section>

  <!-- NAVIGATE --------------------------------------------------------->
  <section class="panel" id="panel-nav">
    <div class="card">
      <div class="dpad">
        <div class="blank"></div>
        <button class="btn" data-cmd="nav_dpad" data-args='{"dir":"up"}'>▲</button>
        <div class="blank"></div>
        <button class="btn" data-cmd="nav_dpad" data-args='{"dir":"left"}'>◀</button>
        <button class="btn mid" data-cmd="nav_ok">OK</button>
        <button class="btn" data-cmd="nav_dpad" data-args='{"dir":"right"}'>▶</button>
        <div class="blank"></div>
        <button class="btn" data-cmd="nav_dpad" data-args='{"dir":"down"}'>▼</button>
        <div class="blank"></div>
      </div>
      <div class="row">
        <button class="btn" data-cmd="nav_back">◁ Back</button>
        <button class="btn" data-cmd="nav_home">Home</button>
      </div>
    </div>
    <div class="card">
      <label class="lbl">Pages</label>
      <div class="row wrap">
        <button class="btn sm" data-cmd="nav_page" data-args='{"page":"#/"}'>Board</button>
        <button class="btn sm" data-cmd="nav_page" data-args='{"page":"#/discover"}'>Discover</button>
        <button class="btn sm" data-cmd="nav_page" data-args='{"page":"#/library"}'>Library</button>
        <button class="btn sm" data-cmd="nav_page" data-args='{"page":"#/calendar"}'>Calendar</button>
        <button class="btn sm" data-cmd="nav_page" data-args='{"page":"#/settings"}'>Settings</button>
      </div>
    </div>
    <div class="card">
      <label class="lbl">Player</label>
      <div class="row wrap">
        <button class="btn sm" data-cmd="toggle_subs_menu">Subs menu</button>
        <button class="btn sm" data-cmd="toggle_audio_menu">Audio menu</button>
        <button class="btn sm" data-cmd="toggle_fullscreen">Fullscreen</button>
        <button class="btn sm" data-cmd="stop_playback">Stop</button>
      </div>
    </div>
  </section>

  <!-- BROWSE --------------------------------------------------------->
  <section class="panel" id="panel-browse">
    <div class="card">
      <input type="text" id="q" placeholder="Search Stremio…" />
    </div>
    <div id="browse-body"><div class="empty">Open the Board on your PC, or search above.</div></div>
  </section>
</main>

<nav class="tabs">
  <button class="active" data-panel="panel-play">Now&nbsp;Playing</button>
  <button data-panel="panel-nav">Navigate</button>
  <button data-panel="panel-browse">Browse</button>
</nav>

<script>
(function () {
  "use strict";

  // ---- token: lift #t=... from the URL, then strip it ------------------
  var TOKEN = "";
  try {
    var m = location.hash.match(/[#&]t=([^&]+)/);
    if (m) { TOKEN = decodeURIComponent(m[1]); history.replaceState(null, "", location.pathname); }
  } catch (e) {}

  function headers(extra) {
    var h = Object.assign({}, extra || {});
    if (TOKEN) h["Authorization"] = "Bearer " + TOKEN;
    return h;
  }
  function q(sel) { return document.querySelector(sel); }
  function fmt(s) {
    if (s == null || isNaN(s)) return "0:00";
    s = Math.max(0, Math.round(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
  }

  // ---- command sender ------------------------------------------------
  function send(cmd, args) {
    return fetch("/cmd", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json", "X-Kai-Remote": "1" }),
      body: JSON.stringify({ cmd: cmd, args: args || {} }),
    }).catch(function () {});
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cmd]");
    if (!b) return;
    var args = {};
    try { args = b.dataset.args ? JSON.parse(b.dataset.args) : {}; } catch (x) {}
    send(b.dataset.cmd, args);
    b.animate([{ opacity: .5 }, { opacity: 1 }], 150);
  });

  // ---- tabs --------------------------------------------------------
  document.querySelectorAll("nav.tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("nav.tabs button").forEach(function (x) { x.classList.remove("active"); });
      document.querySelectorAll(".panel").forEach(function (x) { x.classList.remove("active"); });
      btn.classList.add("active");
      q("#" + btn.dataset.panel).classList.add("active");
    });
  });

  // ---- scrub + volume (commit on release) --------------------------
  var scrub = q("#scrub"), scrubbing = false, lastDur = 0;
  scrub.addEventListener("input", function () { scrubbing = true; });
  scrub.addEventListener("change", function () {
    scrubbing = false;
    send("seek_percent", { pct: (scrub.value / 1000) * 100 });
  });
  var vol = q("#vol"), volTimer = null;
  vol.addEventListener("input", function () {
    q("#vol-val").textContent = vol.value + "%";
    clearTimeout(volTimer);
    volTimer = setTimeout(function () { send("set_volume", { value: +vol.value }); }, 120);
  });

  // ---- audio / sub selects ---------------------------------------
  q("#sel-audio").addEventListener("change", function () { send("set_audio_track", { id: this.value }); });
  q("#sel-sub").addEventListener("change", function () { send("set_sub_track", { id: this.value }); });

  function fillTracks(sel, tracks, current, noneLabel) {
    if (document.activeElement === sel) return;
    var html = noneLabel ? '<option value="no">' + noneLabel + "</option>" : "";
    (tracks || []).forEach(function (t) {
      var name = (t.lang ? t.lang + " " : "") + (t.title || "Track " + t.id);
      html += '<option value="' + t.id + '"' + (t.id == current ? " selected" : "") + ">" + name + "</option>";
    });
    sel.innerHTML = html;
  }

  // ---- search ---------------------------------------------------
  var qi = q("#q"), qTimer = null;
  qi.addEventListener("input", function () {
    clearTimeout(qTimer);
    var v = qi.value.trim();
    if (!v) return;
    qTimer = setTimeout(function () { send("search", { query: v }); }, 500);
  });

  // ---- browse rendering --------------------------------------------
  var browseBody = q("#browse-body");
  var lastBrowseJSON = "";
  function renderBrowse(b) {
    if (!b) return;
    var key = JSON.stringify(b);
    if (key === lastBrowseJSON) return;
    lastBrowseJSON = key;

    var h = "";
    if (b.view === "DETAIL" || b.view === "STREAMS") {
      h += '<div class="crumb"><button data-cmd="nav_back">◁ Back</button><b>Episodes &amp; Streams</b></div>';
      (b.episodes || []).forEach(function (ep) {
        h += '<div class="list-item" data-pick=\'' + esc(JSON.stringify({ season: ep.season, episode: ep.episode })) + "'>" +
          '<div class="meta"><div class="n">' + esc(ep.title || ep.label) + "</div>" +
          '<div class="d">' + (ep.season != null ? "S" + ep.season + " E" + ep.episode : "") + "</div></div></div>";
      });
      if ((b.streams || []).length) {
        h += '<div class="rowlabel">Streams</div>';
        b.streams.forEach(function (s) {
          h += '<div class="list-item" data-stream="' + s.index + '">' +
            '<div class="meta"><div class="n">' + esc(s.addon || "Stream " + (s.index + 1)) + "</div>" +
            '<div class="d">' + esc(s.label) + "</div></div></div>";
        });
      }
    } else if (b.boardRows && b.boardRows.length) {
      b.boardRows.forEach(function (row) {
        h += '<div class="rowlabel">' + esc(row.rowTitle || "") + "</div><div class=\"hscroll\">";
        row.items.forEach(function (it) {
          h += posterCard(it);
        });
        h += "</div>";
      });
    } else if ((b.grid || b.searchResults || []).length) {
      var g = b.grid || b.searchResults;
      g.forEach(function (it) {
        h += '<div class="list-item" data-open=\'' + esc(JSON.stringify({ type: it.type, id: it.metaId })) + "'>" +
          '<img src="' + esc(it.poster || "") + '" onerror="this.style.visibility=\'hidden\'" />' +
          '<div class="meta"><div class="n">' + esc(it.name) + "</div>" +
          '<div class="d">' + esc(it.type || "") + "</div></div></div>";
      });
    } else {
      h = '<div class="empty">Nothing to show for this page.<br>Navigate on the PC or search.</div>';
    }
    browseBody.innerHTML = h;
  }
  function posterCard(it) {
    return '<div class="poster" data-open=\'' + esc(JSON.stringify({ type: it.type, id: it.metaId })) + "'>" +
      '<img src="' + esc(it.poster || "") + '" onerror="this.style.visibility=\'hidden\'" />' +
      '<div class="n">' + esc(it.name) + "</div></div>";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  }); }

  browseBody.addEventListener("click", function (e) {
    var open = e.target.closest("[data-open]");
    if (open) { var o = JSON.parse(open.dataset.open); if (o.id) send("open_detail", o); return; }
    var pick = e.target.closest("[data-pick]");
    if (pick) { send("pick_episode", JSON.parse(pick.dataset.pick)); return; }
    var st = e.target.closest("[data-stream]");
    if (st) { send("launch_stream", { index: +st.dataset.stream }); return; }
  });

  // ---- state stream (SSE with poll fallback) ----------------------
  function applyState(s) {
    var c = s.connections || {}, p = s.player || {}, w = s.webmod || {};
    setPill("#pill-mpv", c.mpv, "player");
    setPill("#pill-ui", c.webmod, "ui");

    // now playing
    var route = w.route || {};
    var playing = route.view === "PLAYER" || (p.duration && !p.idle);
    q("#np-title").textContent = p.media_title || (w.now_playing_meta && w.now_playing_meta.title) || (playing ? "Playing" : "Nothing playing");
    q("#np-sub").textContent = playing
      ? (p.pause ? "Paused" : "Playing") + (p.speed && p.speed !== 1 ? "  ·  " + p.speed + "x" : "")
      : "Open the Browse tab to start something.";
    q("#btn-pause").textContent = p.pause ? "Play" : "Pause";
    q("#btn-next").style.display = (w.player_ui && w.player_ui.nextVideoAvailable) ? "" : "none";

    if (!scrubbing && p.duration) {
      lastDur = p.duration;
      scrub.value = Math.round(((p.time_pos || 0) / p.duration) * 1000);
      q("#t-cur").textContent = fmt(p.time_pos);
      q("#t-dur").textContent = fmt(p.duration);
    }
    if (document.activeElement !== vol && p.volume != null) {
      vol.value = Math.round(p.volume);
      q("#vol-val").textContent = Math.round(p.volume) + "%" + (p.mute ? " (muted)" : "");
    }
    fillTracks(q("#sel-audio"), p.audio_tracks, p.aid, null);
    fillTracks(q("#sel-sub"), p.sub_tracks, p.sid, "Off");

    renderBrowse(w.browse);

    // auto-jump to Now Playing when playback starts
    if (route.view === "PLAYER" && !applyState._wasPlayer) {
      document.querySelector('nav.tabs button[data-panel="panel-play"]').click();
    }
    applyState._wasPlayer = route.view === "PLAYER";
  }
  function setPill(sel, ok, label) {
    var el = q(sel);
    el.textContent = label;
    el.className = "pill " + (ok ? "on" : "off");
  }

  var es = null, lastSeq = -1;
  function connectSSE() {
    try { es && es.close(); } catch (e) {}
    var url = "/events" + (TOKEN ? "?t=" + encodeURIComponent(TOKEN) : "");
    es = new EventSource(url);
    es.onmessage = function (ev) {
      try {
        var s = JSON.parse(ev.data);
        lastSeq = s.seq;
        applyState(s);
      } catch (e) {}
    };
    es.onerror = function () {
      setPill("#pill-mpv", false, "player");
      setPill("#pill-ui", false, "ui");
      // EventSource auto-reconnects; if it's truly dead, fall back to polling.
      if (es.readyState === 2) { es.close(); pollFallback(); }
    };
  }
  var polling = false;
  function pollFallback() {
    if (polling) return;
    polling = true;
    (function tick() {
      fetch("/poll?since=" + lastSeq, { headers: headers({ "X-Kai-Remote": "1" }) })
        .then(function (r) { return r.json(); })
        .then(function (s) { lastSeq = s.seq; applyState(s); })
        .catch(function () {})
        .finally(function () {
          if (polling) setTimeout(tick, 1000);
        });
    })();
    // periodically try to restore SSE
    setTimeout(function () { polling = false; connectSSE(); }, 20000);
  }

  connectSSE();
})();
</script>
</body>
</html>
