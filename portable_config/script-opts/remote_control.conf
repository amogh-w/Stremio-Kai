# Phone Remote - fallback defaults
#
# These values are ONLY used on a cold start before the Settings UI has written
# anything. At runtime the "Phone Remote" section of Stremio's Settings page
# (webmods/Settings/mpv-settings.js) writes localStorage keys (kai-remote-*) which
# are pushed to scripts/remote-control/main.lua via the `remote-control-config`
# script-message and always win over this file.
#
# Managed via Settings - editing this file by hand is only for advanced use.

# Start the remote server automatically when the app launches.
enabled=no

# Interface the HTTP server binds to.
#   0.0.0.0 - reachable from other devices on your LAN (needed for the phone)
#   127.0.0.1 - local only (server effectively disabled for the phone)
host=0.0.0.0

# TCP port for the phone-facing HTTP server. Avoid 11470/12470 (Stremio's own
# streaming server).
port=5000

# Named pipe for talking to mpv. MUST match input-ipc-server in mpv.conf
# (without the \\.\pipe\ prefix).
pipe_name=kai-mpv

# Absolute path to python.exe. Leave empty to auto-detect (works for a normal
# install). Set this if LOG.txt shows "python.exe not auto-detected" - e.g. when
# portable_config is a symlink/junction to a repo checkout.
#   python_path=C:/Users/you/AppData/Local/Programs/Stremio Kai/python.exe
python_path=

# Optional shared PIN/token. When non-empty it is required on every request from
# the phone and the web UI. Leave empty for an open remote on a trusted home LAN.
token=
