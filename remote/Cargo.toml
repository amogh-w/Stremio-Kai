[package]
name = "kai-remote"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
